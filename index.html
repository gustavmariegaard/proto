<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ciircle" />
    <meta name="description" content="ciircle – prototype" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ciircle</title>
    <script>
      /* Mørke skærme: farv siden mørk allerede inden appen er indlæst,
         så Safari ser en mørk side fra første billede. */
      (function () {
        var dark = /\/(flicks(\/|$)|moment\/|profil\/samling\/[^/]+\/vis$|opslag\/[^/]+\/del\/moment$)/.test(location.pathname);
        if (!dark) return;
        document.documentElement.setAttribute('data-dark', '');
        document.documentElement.style.background = '#171717';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = '#171717';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
